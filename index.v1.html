    <style>
      /* Flexbox styles */
      body {
        padding: 0;
        margin: 0;
        height: 100dvh;
        width: 100dvw;

        font-family: 'Montserrat', sans-serif;
        display: flex;
        overflow: hidden; /* Prevent scrolling of the body content */
      }

      .roboto-condensed-400 {
        font-family: 'Roboto Condensed', sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
      }

      .noto-sans-mono-300 {
        font-family: 'Noto Sans Mono', monospace;
        font-optical-sizing: auto;
        font-weight: 300;
        font-style: normal;
        font-variation-settings: 'wdth' 100;
      }

      .victor-mono-400 {
        font-family: 'Victor Mono', monospace;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
      }

      .main {
        display: flex;
        width: 100vw;
        height: 100vh;
        max-width: 100%;
        background-color: rgba(0, 0, 0, 0);
        flex-direction: column;
        z-index: 1;
        position: relative;
      }

      .geoContainer {
        display: flex; /* Enable flexbox */
        width: 100%; /* Container takes full width of the parent */
        height: 10%; /* Container height is 10% of its parent */
        align-items: center; /* Vertically center align the children */
        background-color: #113355;
        z-index: 5;
      }

      .mapIcon {
        flex: 0 1 auto; /* Do not grow, can shrink, based on its content size */
        margin-right: auto; /* Pushes all other elements to the right */
        height: 100%; /*Let it fill the space*/
        padding: 10px; /*Shrink it to look nice*/
      }

      .geoText {
        flex: 1 1 auto; /* Grow to use available space, can shrink */
        text-align: left; /* Text is left-justified */
        font-size: calc(
          1.5dvw + 5px
        ); /* Adjust the base size and extra pixels as needed */
        white-space: nowrap; /* Ensure text stays on one line */
        overflow: hidden; /* Hide overflow text */
        text-overflow: ellipsis; /* Add ellipsis for overflow text */
        color: white;
      }

      .clockContainer {
        flex: 0 1 auto; /* Do not grow, can shrink, based on its content size */
        margin-left: auto; /* Pushes itself to the right */
        color: white;
        font-size: 4dvw;
      }

      .textClock {
        font-size: 2ch;
        color: white;
        display: flex;
        flex-direction: column; /* Ensures the flex items are aligned vertically */
        justify-content: flex-end; /* Aligns children (text) at the bottom */
        height: 80%; /* You might need to adjust or set the height to make room for alignment */
        padding-right: 10px;
      }

      .playingScreen {
        flex: 1;
        height: 80%;
        background-color: rgba(0, 0, 0, 0);
        position: relative; /* Added position relative for absolute positioning */
      }

      .channelScreen {
        display: grid;
        grid-template-columns: repeat(5, 1fr); /* Creates 5 equal columns */
        grid-auto-rows: calc(
          (40vh - 2 * 5px - 2 * 10px) / 3
        ); /* Each row takes one-third of the height of .channelScreen minus padding and gap */
        overflow-y: auto; /* Enables vertical scrolling for additional rows */
        height: 40vh; /* Fixed total height to maintain exactly three visible rows */
        background-color: #001133;

        width: 100%;
        align-items: center; /* Vertically centers items in each cell */
        gap: 10px; /* Space between grid items */
        padding: 5px;
        z-index: 2;
        justify-content: center; /* Centers the last row's items if fewer than 5 */
      }

      .channelItem {
        background-color: #113355;
        cursor: pointer;
        overflow: hidden;
        border-radius: 20px;
        position: relative;
        border: none;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%; /* Takes full height of the grid row */
        width: 100%;
        transition: transform 0.2s; /* Smooth hover effect for visual feedback */
      }

      .channelItem:hover {
        transform: scale(1); /* Optional: scale items on hover */
        border: 2px solid #ffff58;
        background-color: #225588;
      }

      /* Remove margin from last item to prevent overflow */
      .channelItem:last-child {
        margin-right: 0px;
      }
      .channelImage {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 150%;
        max-height: 150%;
      }
      /* Hide scrollbar for Chrome, Safari, and Opera */
      .channelScreen::-webkit-scrollbar {
        display: none;
      }

      /* Style for stop button */
      .stopButton {
        position: absolute;
        bottom: -10px;
        right: 0px;
        width: 15dvh;
        height: auto;
        cursor: pointer;
        display: none; /* Initially hide stop button */

        border-radius: 10px;
      }

      /* Style for mode button */

        bottom: 5px;
        left: 5px;
        width: 10dvw;
        height: auto;
        cursor: pointer;
        display: flex; /* Initially hide stop button */

      .nowPlayingText,

        right: 10px; /* Adjust left position as needed */

    <script>
      // Function to check if a URL should be excluded from caching
      function shouldExcludeFromCache(url) {
        return (
          url.includes('.mp3') || url.includes('.m3u') || url.includes('.m3u8')
        )
      }

      var currentStream = null
      var direction, roll, pitch
      var modeButton = document.getElementById('modeButton')

      function startPlaying(streamUrl, channelImage) {
        var playingScreen = document.getElementById('playing-Screen')
        var stopButton = document.getElementById('stopButton')
        var nowPlayingText = document.querySelector('.nowPlayingText')
        var nowPlayingTextStartScreen = document.querySelector(
          '.nowPlayingTextStartScreen'
        )

        // Show the "Now Playing" text
        nowPlayingText.style.display = 'block'
        nowPlayingTextStartScreen.style.display = 'none'

        // Check if there's already an audio element playing
        var existingAudio = playingScreen.querySelector('audio')
        if (existingAudio) {
          existingAudio.pause()
          playingScreen.removeChild(existingAudio)
          stopButton.style.display = 'none'
          nowPlayingText.style.backgroundImage = "url('images/poster4.png')"
        }

        var audio = document.createElement('audio')

        // Check if the stream is M3U8 (HLS) or AAC
        if (streamUrl.endsWith('.m3u8') && Hls.isSupported()) {
          var hls = new Hls()
          hls.loadSource(streamUrl)
          hls.attachMedia(audio)
          hls.on(Hls.Events.MANIFEST_PARSED, function () {
            audio.play()
            stopButton.style.display = 'block'
            nowPlayingText.style.backgroundImage = "url('" + channelImage + "')"
          })
        } else {
          // Directly play AAC or other audio formats
          audio.src = streamUrl
          audio.play()
          stopButton.style.display = 'block'
          nowPlayingText.style.backgroundImage = "url('" + channelImage + "')"
        }

        playingScreen.appendChild(audio)

        // Stop button functionality
        stopButton.addEventListener('click', function () {
          audio.pause()
          stopButton.style.display = 'none'
          nowPlayingText.style.display = 'none'
          nowPlayingTextStartScreen.style.display = 'block'
          if (typeof hls !== 'undefined') {
            hls.destroy() // Safely destroy HLS if it was used
          }
        })
      }

      // Mode button functionality
      modeButton.addEventListener('click', function () {
        if (darkmode) {
          darkmode = false
          document.getElementById('channel-Screen').style.backgroundColor =
            '#001133'
        } else {
          darkmode = true
          document.getElementById('channel-Screen').style.backgroundColor =
            '#000000'
        }
        initMap()
      })

      // Function to update the clock
      function updateClock() {
        var now = new Date()
        var hours = now.getHours()
        var meridiem = hours >= 12 ? 'PM' : 'AM'
        hours = hours % 12 || 12 // Convert to 12-hour format
        var minutes = now.getMinutes()
        var seconds = now.getSeconds()
        // Remove leading zero for hours
        hours = hours.toString().replace(/^0/, '')
        var formattedTime = hours + ':' + minutes.toString().padStart(2, '0')
        document.getElementById('clock').innerHTML = formattedTime
        document.getElementById('meridien').innerHTML = meridiem
      }

      // Update clock every second
      setInterval(updateClock, 10000)

      var channelScreen = document.getElementById('channel-Screen')
      var isDragging = false
      var startX, scrollLeft
      updateClock()

      // Easing equation for smooth animation
      Math.easeInOutQuad = function (t, b, c, d) {
        t /= d / 2
        if (t < 1) return (c / 2) * t * t + b
        t--
        return (-c / 2) * (t * (t - 2) - 1) + b
      }

      // Function to get current latitude and longitude coordinates using browser's geolocation API
      function getCurrentLocation() {
        return new Promise((resolve, reject) => {
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
              position => {
                resolve({
                  latitude: position.coords.latitude,
                  longitude: position.coords.longitude
                })
              },
              error => {
                reject(error)
              }
            )
          } else {
            reject(new Error('Geolocation is not supported by this browser'))
          }
        })
      }

      // Function to perform reverse geocoding using OpenStreetMap Nominatim API
      function reverseGeocode(lat, lon) {
        // API endpoint for reverse geocoding
        const apiUrl = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`

        // Fetch the data from the API
        fetch(apiUrl)
          .then(response => {
            if (!response.ok) {
              throw new Error('Network response was not ok')
            }
            return response.json()
          })
          .then(data => {
            // Extract street and village/suburb information from the response
            const address = data.address
            const street = address.road || 'Unknown street'
            const village =
              address.village || address.suburb || 'Unknown village/suburb'
            const city = address.city
            const state = address.state
            const neighbourhood = address.neighbourhood
            const house = address.house_number

            // Update location div
            document.getElementById(
              'geotext'
            ).innerHTML = ` ${street} in  ${village}, ${city}`

            // Store location data in local storage
            localStorage.setItem('lastLocation', JSON.stringify(data))
          })
          .catch(error => {
            console.error(
              'There was a problem with the fetch operation:',
              error
            )
          })
      }

      // Function to get current location every 30 seconds and perform reverse geocoding
      function getLocationAndReverseGeocode() {
        // Get current location
        getCurrentLocation()
          .then(location => {
            // Perform reverse geocoding
            reverseGeocode(location.latitude, location.longitude)
          })
          .catch(error => {
            console.error('Error getting current location:', error.message)
          })
      }

      // Get current location and perform reverse geocoding every 30 seconds
      getLocationAndReverseGeocode() // Initial call
      setInterval(getLocationAndReverseGeocode, 30000) // Repeat every 30 seconds

      // Function to handle location error event
      function onLocationError(e) {
        // Display error message in an alert
        var errorMessage = 'Error: Unable to retrieve your location.'
        alert(errorMessage)

        // Automatically close the alert after a certain duration (e.g., 3 seconds)
        setTimeout(function () {
          // Check if the alert is still open
          if (alert.textContent === errorMessage) {
            // Close the alert
            alert.close()
          }
        }, 3000) // 3000 milliseconds = 3 seconds
      }

      function logGPSData() {
        // Check if geolocation is supported by the browser
        if ('geolocation' in navigator) {
          // Retrieve GPS data
          navigator.geolocation.getCurrentPosition(
            position => {
              // Extract relevant information from the position object

              const { coords } = position

              // Convert speed from meters per second to kilometers per hour and remove decimal places
              var speed =
                coords.speed !== null ? (coords.speed * 3.6).toFixed(0) : '---'

              // Convert speed from meters per second to miles per hour and remove decimal places
              var speedMph =
                coords.speed !== null
                  ? (coords.speed * 2.23694).toFixed(0)
                  : '---'

              // Altitude in meters above sea level without decimal places
              const altitude =
                coords.altitude !== null
                  ? Math.round(coords.altitude).toFixed(0)
                  : '----'

              // Altitude in feet above sea level without decimal places
              const altitudeFeet =
                coords.altitude !== null
                  ? Math.round(coords.altitude * 3.28084).toFixed(0)
                  : '----'

              // Compass direction in degrees (0-360) without decimal places
              const heading =
                coords.heading !== null
                  ? Math.round(coords.heading).toFixed(0)
                  : '---'

              const dirData = `${
                coords.heading !== null
                  ? '<span class="text">' +
                    heading +
                    '</span><span class="text1">Heading</span>'
                  : '<span class="text">---</span><span class="text1">Heading</span>'
              }`

              // Create a string with the GPS data
              const speedData = `${
                speed !== '---'
                  ? '<span class="text">' +
                    speed +
                    ' </span><span class="text1">km/h </span>'
                  : '<span class="text">0</span><span class="text1">km/h</span>'
              }`

              const mphData = `${
                speedMph !== '---'
                  ? '<span class="text">' +
                    speedMph +
                    '</span><span class="text1">mph</span>'
                  : '<span class="text">0</span><span class="text1">mph</span>'
              }`

              // Create a string with the GPS data
              const altData = `${
                altitude !== '----'
                  ? '<span class="text">' +
                    altitude +
                    '</span><span class="text1">Meters</span>'
                  : '<span class="text">---</span><span class="text1">Meters</span>'
              }`

              const faltData = `${
                coords.altitude !== null
                  ? '<span class="text">' +
                    altitudeFeet +
                    '</span><span class="text1">Feet</span>'
                  : '<span class="text">---</span><span class="text1">Feet</span>'
              }`

              // Update the content of the gpsdata div
              document.getElementById('mphData').innerHTML = mphData
              document.getElementById('speeddata').innerHTML = speedData
              document.getElementById('headingData').innerHTML = heading
              document.getElementById('altitudeData').innerHTML = altData
              document.getElementById('faltData').innerHTML = faltData
              document.getElementById('directionData').innerHTML = dirData

              // Rotate the compass image based on the heading
              const compassImage = document.querySelector('.compassImage')
              if (heading !== '----') {
                compassImage.style.transform = `rotate(${360 - heading}deg)` // Adjust rotation direction if needed
              }
            },
            error => {
              // Display error message in an alert
              var errorMessage = 'Error: Unable to retrieve GPS data.'
              console.log(errorMessage)

              // Automatically close the alert after a certain duration (e.g., 3 seconds)
              setTimeout(function () {
                // Check if the alert is still open
                if (alert.textContent === errorMessage) {
                  // Close the alert
                  alert.close()
                }
              }, 500) // 500 milliseconds = half second

              console.error('Error retrieving GPS data:', error.message)
            }
          )
        } else {
          // Display a message if geolocation is not supported
          console.error('Geolocation is not supported by this browser')
        }
      }

      // Call the function to log GPS data every second
      setInterval(logGPSData, 100)

      // Service Worker registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('service-worker.js')
            .then(function (registration) {
              console.log(
                'ServiceWorker registration successful with scope: ',
                registration.scope
              )
            })
            .catch(function (err) {
              console.log('ServiceWorker registration failed: ', err)
            })
        })
      }
    </script>

    <script>
      // Initialize map
      let darkmode = false
      let myIcon
      var map = L.map('map').setView([0, 0], 18) // Default to center of the world with a higher zoom level
      var marker

      function initMap() {
        // Remove existing marker from the map, if it exists
        if (marker) {
          map.removeLayer(marker)
        }

        if (darkmode) {
          modeButton.src = 'images/dark-mode-button.png'
          document.getElementById('compassImage').src =
            'images/compass-dark.png'

          myIcon = L.icon({
            iconUrl: 'images/car-icon.png',
            iconSize: [50, 50],
            iconAnchor: [25, 25] // Adjusted to be the center of the icon
          })

          // Add CartoDB Dark Matter tile layer to the map
          L.tileLayer(
            'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',
            {
              attribution:
                '© <a href="https://carto.com/attributions">CartoDB</a> contributors',
              maxZoom: 19,
              edgeBufferTiles: 2, // Load one additional tile outside the visible map area
              detectRetina: true,
              rotationAngle: 0 // Set rotation angle to 0 degrees
            }
          ).addTo(map)
        } else {
          modeButton.src = 'images/light-mode-button.png'
          document.getElementById('compassImage').src = 'images/compass.png'
          myIcon = L.icon({
            iconUrl: 'images/car-icon.png',
            iconSize: [60, 60],
            iconAnchor: [30, 30], // Adjusted to be the center of the icon
            rotationAngle: 0 // Set rotation angle to 0 degrees
          })

          // Add OpenStreetMap tile layer to the map using Leaflet Mercator plugin
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution:
              '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19,
            edgeBufferTiles: 2, // Load one additional tile outside the visible map area
            detectRetina: true,
            rotationAngle: 0 // Set rotation angle to 0 degrees
          }).addTo(map)
        }
        marker = L.marker([0, 0], { icon: myIcon }).addTo(map)
      }

      initMap()

      /*



// Add Stamen Watercolor tile layer to the map
L.tileLayer('https://stamen-tiles-{s}.a.ssl.fastly.net/watercolor/{z}/{x}/{y}.jpg', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://stamen.com">Stamen Design</a>',
    subdomains: ['a', 'b', 'c', 'd'],
    maxZoom: 19
}).addTo(map);

// Add CartoDB Voyager tile layer to the map using Leaflet
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
}).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
}).addTo(map);

https://stamen-tiles-{s}.a.ssl.fastly.net/watercolor/{z}/{x}/{y}.jpg

*/

      // Add CSS transition for smooth rotation
      map.getContainer().style.transition = 'transform 0.5s ease-in-out'

      // Variables to hold the last heading and compass reading
      var lastHeading = 0
      var lastCompass = 0

      // Debounce function to limit the rate of updates
      function debounce(func, wait) {
        let timeout
        return function (...args) {
          clearTimeout(timeout)
          timeout = setTimeout(() => func.apply(this, args), wait)
        }
      }

      function updateMarker(e) {
        marker.setLatLng(e.latlng)
      }

      function onLocationFound(e) {
        // Update last known heading and compass if available
        if (typeof e.heading === 'number') {
          lastHeading = e.heading
        }
        if (typeof e.compass === 'number') {
          lastCompass = e.compass
        }

        // Adjust map orientation based on last known heading
        var mapOrientation = (360 - lastHeading) % 360

        // Set the rotation of the map container using CSS
        map.getContainer().style.transform = 'rotate(' + mapOrientation + 'deg)'
        map.getContainer().style.transformOrigin = 'center' // Ensure the rotation is around the center

        // Remove the counter-rotation from the marker icon
        if (marker._icon) {
          marker._icon.style.transform = `rotate(0deg)`
          marker._icon.style.transform = `rotate(${e.Heading}deg)`
          marker._icon.style.transformOrigin = 'center' // Set the rotation origin to the center of the icon
        }

        // Set the view with adjusted center and fixed zoom level 16
        var lat = e.latlng.lat
        var lng = e.latlng.lng // Adjust the longitude to shift the map center to the left

        map.setView([lat, lng], 17, { animate: true })
        map.invalidateSize()

        // Remove the zoom control from the map
        map.removeControl(map.zoomControl)

        // Update marker position
        updateMarker(e)
      }

      // Debounced version of the onLocationFound function
      var debouncedOnLocationFound = debounce(onLocationFound, 200) // Adjust debounce delay as needed

      // Function to handle location error event
      function onLocationError(e) {
        console.log('Error: Unable to retrieve your location.')
      }

      // Register event listeners for location found and error events
      map.on('locationfound', debouncedOnLocationFound)
      map.on('locationerror', onLocationError)

      // Get user's location using geolocation
      map.locate({ setView: true, maxZoom: 19 }) // Initial location retrieval

      // Update marker position every half second
      setInterval(function () {
        map.locate({ setView: false })
      }, 500) // Update every half second

      channelScreen.addEventListener('wheel', function (event) {
        event.preventDefault() // Prevent default scrolling behavior
        // Adjust scrollTop based on wheel delta
        channelScreen.scrollTop += event.deltaY
      })

      channelScreen.addEventListener('mousedown', function (event) {
        isDragging = true
        startX = event.pageX - channelScreen.offsetLeft
        scrollLeft = channelScreen.scrollLeft
      })

      channelScreen.addEventListener('mouseup', function () {
        isDragging = false
      })

      channelScreen.addEventListener('mousemove', function (event) {
        if (!isDragging) return
        var x = event.pageX - channelScreen.offsetLeft
        var walk = (x - startX) * 2 // Adjust scroll speed here
        smoothScroll(channelScreen, scrollLeft - walk, 200) // Smoothly scroll to the new position
      })

      channelScreen.addEventListener('touchstart', function (event) {
        isDragging = true
        startX = event.touches[0].pageX - channelScreen.offsetLeft
        scrollLeft = channelScreen.scrollLeft
      })

      channelScreen.addEventListener('touchend', function () {
        isDragging = false
      })

      channelScreen.addEventListener('touchmove', function (event) {
        if (!isDragging) return
        var x = event.touches[0].pageX - channelScreen.offsetLeft
        var walk = (x - startX) * 2 // Adjust scroll speed here
        smoothScroll(channelScreen, scrollLeft - walk, 200) // Smoothly scroll to the new position
      })

      // Function to smoothly scroll to a specific position
      function smoothScroll(element, to, duration) {
        var start = element.scrollLeft,
          change = to - start,
          currentTime = 0,
          increment = 20

        var animateScroll = function () {
          currentTime += increment
          var val = Math.easeInOutQuad(currentTime, start, change, duration)
          element.scrollLeft = val
          if (currentTime < duration) {
            setTimeout(animateScroll, increment)
          }
        }
        animateScroll()
      }
    </script>
